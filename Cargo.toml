[package]
name = "leakwatch"
version = "0.1.0"
edition = "2021"

[dependencies]
sysinfo = "=0.30.13"
rusqlite = { version = "=0.31.0", features = ["bundled"] }
nvml-wrapper = "=0.9.0"
serde = { version = "=1.0.210", features = ["derive"] }
serde_json = "=1.0.128"
clap = { version = "=4.4.18", features = ["derive"] }
chrono = "=0.4.38"
ctrlc = "=3.4.4"

[profile.release]
opt-level = 3
lto = true
strip = true
